services:
  postgres:
    image: postgres:16-alpine
    container_name: formplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: formplatform
    ports:
      - "5432:5432"
    volumes:
      - formplatform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d formplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  formplatform-pgdata: